[package]
name = "cubrid-fastmig"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fastmig-catalog = { path = "../catalog" }
fastmig-copy = { path = "../copy" }
fastmig-index = { path = "../index" }
fastmig-ondisk = { path = "../ondisk" }
fastmig-progress = { path = "../progress" }
fastmig-verify = { path = "../verify" }

[features]
default = ["heap-counter"]
# the counting global allocator; build without it (--no-default-features) to measure its cost
heap-counter = []
